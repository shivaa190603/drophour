<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Favicon & Icons for Google Search and Browsers -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Title & Metadata with Target Keywords -->
    <title>DropHour — Share Anywhere: Free PDF Host &amp; Temporary File Sharing</title>
    <meta name="description" content="Host PDFs and share files anywhere instantly. Free temporary file sharing with private links, short codes, and QR codes. Automatically deleted after 1 hour. No account required." />
    <meta name="keywords" content="share anywhere, pdf host, pdfhost, temporary file sharing, share files, free file upload, anonymous file sharing, send files, drophour, temporary cloud storage" />
    <meta name="author" content="DropHour" />
    
    <!-- Google Site Verification -->
    <meta name="google-site-verification" content="efOxsvqVgXrwRNkbpYw9rCNoqGSRjlka74aAAp0NM-E" />

    <!-- Open Graph (Ensures Google & Social media show DropHour name & logo) -->
    <meta property="og:site_name" content="DropHour" />
    <meta property="og:title" content="DropHour — Share Anywhere: Free PDF Host &amp; Temporary File Sharing" />
    <meta property="og:description" content="Host PDFs and share files anywhere instantly. Free temporary file sharing with private links, short codes, and QR codes. Automatically deleted after 1 hour. No account required." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://drophour.netlify.app/" />
    <meta property="og:image" content="https://drophour.netlify.app/apple-touch-icon.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="DropHour — Share Anywhere" />
    <meta name="twitter:description" content="Host PDFs and share files anywhere instantly. Free temporary file sharing with 1-hour expiration." />
    <meta name="twitter:image" content="https://drophour.netlify.app/apple-touch-icon.png" />

    <!-- Schema.org Structured Data (Tells Google to display 'DropHour' as the Site Name in Search Results) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "DropHour",
      "alternateName": [
        "Drop Hour",
        "DropHour - Share Anywhere",
        "ShareAnywhere",
        "PDF Host DropHour"
      ],
      "url": "https://drophour.netlify.app/",
      "description": "Free temporary file sharing and PDF host service. Files automatically expire after 1 hour."
    }
    </script>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#F7F7F5] text-[#171717] antialiased selection:bg-[#2563EB] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
